[env:ecube]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200 ; Try a lower speed for stability
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; Add these two lines to prevent the monitor from resetting the board
monitor_rts = 0
monitor_dtr = 0

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
